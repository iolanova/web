<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Welcome</title>
        
        <!-- Redirect after 3 seconds -->
        <meta http-equiv="refresh" content="4; url=index1.html">
            <link rel="icon" type="image/png" href="../img/IolanovaLogo.png">
                <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
                    <meta charset="utf-8">
                        <meta name="robots" content="nofollow, noimageindex">
                            <meta name="robots" content="max-image-preview:none">
                                <meta name="viewport" content="width=device-width, initial-scale=1">
                                    <meta name="keywords" content="economics, causal chain, learning, quiz">
                                        <meta name="copyright" content="copyright 2025 Iolanova-Team">
                                            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
                                                <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
                                                <script src="JsHelper.js"></script>
                                                <link rel="stylesheet" type="text/css" href="myDesign.css">
                                                    
                                                    <style>
                                                        body, html {
                                                            margin: 0;
                                                            height: 100%;
                                                            overflow: hidden;
                                                            background: black;
                                                        }
                                                        
                                                        video {
                                                            width: 100%;
                                                            height: 100%;
                                                            object-fit: cover;
                                                        }
                                                        /* Optional overlay text */
                                                        .overlay {
                                                            position: absolute;
                                                            top: 50%;
                                                            left: 50%;
                                                            transform: translate(-50%, -50%);
                                                            color: white;
                                                            text-align: center;
                                                            z-index: 2;
                                                        }
                                                        
                                                        /* Skip Button styling */
                                                        .skip-btn {
                                                            position: absolute;
                                                            background-color: rgba(255, 255, 255, 0.6); /* Light background */
                                                            color: #333;
                                                            padding: 10px 20px;
                                                            border-radius: 5px;
                                                            font-size: 16px;
                                                            font-weight: 600;
                                                            border: none;
                                                            cursor: pointer;
                                                            transition: all 0.3s ease;
                                                            z-index: 2;
                                                        }
                                                        
                                                        /* Button Hover Effects */
                                                        .skip-btn:hover {
                                                            background-color: rgba(255, 255, 255, 0.9);
                                                            transform: scale(1.05);
                                                        }
                                                        
                                                        .skip-btn:active {
                                                            transform: scale(1);
                                                            background-color: rgba(255, 255, 255, 0.7);
                                                        }
                                                    </style>
                                                </head>
    <body>
        <!-- Video -->
        <video autoplay muted playsinline>
            <source src="../img/Intro_Splash.mp4" type="video/mp4">
                Your browser does not support the video tag.
        </video>
        
        <!-- Optional Text -->
        <div class="overlay">
            <div class="intro-box">
                <h1>Bienvenido</h1>
                <h3>a iolanova...</h3>
                <div class="spinner-border text-light mt-3"></div>
            </div>
        </div>
        
        <button class="skip-btn" onclick="skipIntro()">Skip</button>
        
        <!-- Redirect after 3 seconds -->
        <script>
            // Golden Ratio position calculation
            window.onload = function() {
                const skipBtn = document.querySelector('.skip-btn');
                const video = document.getElementById('introVideo');
                
                const width = window.innerWidth;
                const height = window.innerHeight;
                
                // Golden Ratio positions
                const goldenX = width * 0.618;   // Horizontal position
                const goldenY = height * 0.618;  // Vertical position
                
                // Set the skip button to the golden ratio position
                skipBtn.style.left = `${goldenX - skipBtn.offsetWidth / 2}px`;  // Horizontal center
                skipBtn.style.top = `${goldenY - skipBtn.offsetHeight / 2}px`;  // Vertical center
            };
            
            function skipIntro() {
                // Mark intro as seen
                localStorage.setItem("introPlayed", "true");
                
                // Redirect to home page
                window.location.href = "index1.html";
            }
            
            const video = document.getElementById("introVideo");
            
            video.addEventListener("ended", function() {
                // Mark intro as seen
                localStorage.setItem("introPlayed", "true");
                
                // Redirect after video ends
                window.location.href = "index1.html";
            });
        </script>
    </body>
</html>
